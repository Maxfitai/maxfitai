version: '3.9'
services:
  app:
    build: .
    container_name: maxfitai_app
    restart: always
    expose:
      - '3000'
      - '3001'
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app
