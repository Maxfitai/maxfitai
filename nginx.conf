events {}

http {
    # HTTP -> HTTPS redirect for root domain only
    server {
        listen 80;
        server_name maxfitai.com admin.maxfitai.com dashboard.maxfitai.com coach.maxfitai.com;

        # Keep certbot renewals working
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server for root domain only
    server {
        listen 443 ssl;
        server_name maxfitai.com www.maxfitai.com;

        ssl_certificate     /etc/letsencrypt/live/maxfitai.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/maxfitai.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /admin {
            return 301 https://admin.maxfitai.com$request_uri;
        }

        # Frontend auth is stored in localStorage (origin-scoped), so keep auth
        # pages on dashboard subdomain to avoid double-login across origins.
        location = /login {
            return 301 https://dashboard.maxfitai.com/login;
        }

        location = /signup {
            return 301 https://dashboard.maxfitai.com/signup;
        }

        location = /forgot-password {
            return 301 https://dashboard.maxfitai.com/forgot-password;
        }

        location = /reset-password {
            return 301 https://dashboard.maxfitai.com/reset-password;
        }

        location /dashboard {
            return 301 https://dashboard.maxfitai.com$request_uri;
        }

        # Proxy websocket traffic through 443 so clients use wss://maxfitai.com/ws.
        location /ws {
            proxy_pass http://app:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location / {
            proxy_pass http://app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS server for admin subdomain
    server {
        listen 443 ssl;
        server_name admin.maxfitai.com;

        ssl_certificate     /etc/letsencrypt/live/admin.maxfitai.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.maxfitai.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # admin.maxfitai.com → serves Payload admin panel (lives at /admin on the app).
        # We rewrite ONLY the root so the browser lands on /admin.
        # All other paths (including /admin/*, /_next/*, /api/*) are proxied as-is
        # so Payload's internal redirects and asset URLs keep working.
        location = / {
            return 302 https://admin.maxfitai.com/admin;
        }

        location / {
            proxy_pass http://app:3000;
            proxy_set_header Host maxfitai.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }

    # HTTPS server for dashboard subdomain
    server {
        listen 443 ssl;
        server_name dashboard.maxfitai.com;

        ssl_certificate     /etc/letsencrypt/live/dashboard.maxfitai.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dashboard.maxfitai.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location = / {
            return 302 https://dashboard.maxfitai.com/dashboard;
        }

        location / {
            proxy_pass http://app:3000;
            proxy_set_header Host maxfitai.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS server for coach subdomain
    server {
        listen 443 ssl;
        server_name coach.maxfitai.com;

        ssl_certificate     /etc/letsencrypt/live/coach.maxfitai.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/coach.maxfitai.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location = / {
            return 302 https://coach.maxfitai.com/coach;
        }

        location / {
            proxy_pass http://app:3000;
            proxy_set_header Host maxfitai.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}